<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicant Signup - SkillBridge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        input::placeholder { color: #718096; }
        input:focus { border-color: #0072ff; }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button:hover { opacity: 0.85; }

        .signup-btn {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            color: white;
        }

        .google-btn {
            background: linear-gradient(90deg, #f093fb, #f5576c);
            color: white;
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            color: #718096;
            position: relative;
        }

        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        .divider span {
            background: transparent;
            padding: 0 10px;
            position: relative;
        }

        .error {
            color: #fc8181;
            margin-top: 10px;
            text-align: center;
            font-size: 0.9rem;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #63b3ed;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover { text-decoration: underline; }

        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #a0aec0;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }

        .login-link a { color: #63b3ed; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎓 Applicant Signup</h2>

        <button class="google-btn" id="googleSignup">Sign up with Google</button>

        <div class="divider"><span>or</span></div>

        <form id="signupForm" autocomplete="off">
            <input type="text" id="firstName" placeholder="First Name" required autocomplete="off">
            <input type="text" id="lastName" placeholder="Last Name" required autocomplete="off">
            <input type="text" id="idNumber" placeholder="ID Number" required autocomplete="off">
            <input type="text" id="nqf" placeholder="NQF Level (e.g., 4, 5, 6)" required autocomplete="off">
            <input type="email" id="email" placeholder="Email" required autocomplete="off">
            <input type="password" id="password" placeholder="Password" required autocomplete="new-password">
            <button type="submit" class="signup-btn">Sign Up</button>
        </form>

        <div id="errorMsg" class="error"></div>
        <a href="/dummy-site/roles.html" class="back-link">← Back to Home</a>
        <div class="login-link">Already have an account? <a href="/login.html">Login here</a></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDgirf1peij-kkhv9ir_5ea-L245W921w8",
            authDomain: "skillbridge-5dcec.firebaseapp.com",
            projectId: "skillbridge-5dcec",
            storageBucket: "skillbridge-5dcec.firebasestorage.app",
            messagingSenderId: "188202128236",
            appId: "1:188202128236:web:aee457ff824cba8c965949",
            measurementId: "G-NBYFQX660Y"
        };
        firebase.initializeApp(firebaseConfig);

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const userCredential = await firebase.auth().createUserWithEmailAndPassword(
                    document.getElementById('email').value,
                    document.getElementById('password').value
                );
                localStorage.setItem('userRole', 'Applicant');
                localStorage.setItem('userData', JSON.stringify({
                    role: 'Applicant',
                    firstName: document.getElementById('firstName').value,
                    lastName: document.getElementById('lastName').value,
                    idNumber: document.getElementById('idNumber').value,
                    nqf: document.getElementById('nqf').value,
                    email: document.getElementById('email').value,
                    uid: userCredential.user.uid
                }));
                alert('Signup successful! Please login.');
                window.location.href = '/login.html';
            } catch (error) {
                document.getElementById('errorMsg').innerText = error.message;
            }
        });

        document.getElementById('googleSignup').addEventListener('click', async () => {
            try {
                const result = await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
                const displayName = result.user.displayName || '';
                localStorage.setItem('userRole', 'Applicant');
                localStorage.setItem('userData', JSON.stringify({
                    role: 'Applicant',
                    firstName: displayName.split(' ')[0],
                    lastName: displayName.split(' ')[1] || '',
                    email: result.user.email,
                    uid: result.user.uid
                }));
                alert('Signup successful! Please login.');
                window.location.href = '/login.html';
            } catch (error) {
                document.getElementById('errorMsg').innerText = error.message;
            }
        });
    </script>
</body>
</html>
