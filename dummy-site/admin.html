<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin View</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1> Admin View</h1>
        <p>Review submitted listings and decide whether they should be visible to applicants.</p>
    </header>

    <main class="page-container">

        <section class="feature-card">
            <h2>Pending Listing Review</h2>
            <p><strong>Title:</strong> Software Internship</p>
            <p><strong>Provider:</strong> Cloud Skills Academy</p>
            <p><strong>Status:</strong> <span id="statusText">Pending</span></p>
            <p><strong>Description:</strong> Beginner-friendly internship for aspiring software developers.</p>

            <button id="approveBtn">Approve</button>
            <button id="rejectBtn">Reject</button>
            <p id="adminMessage"></p>
        </section>

        <a href="index.html" class="back-link">← Back to Home</a>

    </main>

    <script src="script.js"></script>
</body>
</html>
