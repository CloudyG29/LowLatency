
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provider Dashboard - SkillBridge</title>
  <link rel="stylesheet" href="../roles_css/provider_view.css" />
  <style>
    .nqf-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
      color: #333;
      margin-bottom: 10px;
    }
    .nqf-select:focus {
      outline: none;
      border-color: #4f46e5;
    }
    .nqf-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
      display: block;
    }
  </style>
</head>

<body>

  <!-- From Uiverse.io by PriyanshuGupta28 -->
  <div id="loader" class="loader-overlay hidden">
    <div class="spinner">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>

  <div class="layout">

    <nav class="sidebar">
      <h2>SkillBridge</h2>
      <hr />
      <ul class="nav-links">
        <li><a href="#" onclick="showTab('post')">Post Opportunity</a></li>
        <li><a href="#" onclick="showTab('manage')">My Opportunities</a></li>
        <li><a href="#" onclick="showTab('applications')">Applications</a></li>
        <li><a href="/login">Logout</a></li>
      </ul>
    </nav>

    <main class="container">
      <div class="header">
        <h1>🏢 Provider Dashboard</h1>
        <p>Welcome!</p>
      </div>

      <!-- POST TAB -->
      <div id="postTab" class="tab-content active">
        <h2>Post a New Opportunity</h2>
        <div class="card">
          <input id="listname" placeholder="Title *" required />
          <input id="list_type" placeholder="Type (e.g. Internship, Learnership, Job) *" required />
          <input id="stipend" placeholder="Stipend (e.g., R5000/month)" />
          <input id="location" placeholder="Location (e.g., Johannesburg, Cape Town)" />
          <input id="duration" placeholder="Duration (e.g., 12 months)" />
          <input id="requirements" placeholder="Requirements (e.g., Matric, NQF 4)" />

          <!-- NQF Level Dropdown (populated from SAQA data) -->
          <label class="nqf-label">NQF Level Required</label>
          <select id="nqf_level" class="nqf-select">
            <option value="">Loading NQF levels...</option>
          </select>

          <input id="closing_date" type="text" placeholder="Closing Date (YYYY-MM-DD)" onfocus="this.type='date'"
            onblur="if(!this.value)this.type='text'" />
          <textarea id="description" placeholder="Description *"></textarea>
          <button class="post-btn" onclick="postOpportunity()">Post</button>
          <p id="msg"></p>
        </div>
      </div>

      <!-- MANAGE TAB -->
      <div id="manageTab" class="tab-content">
        <h2>My Opportunities</h2>
        <div id="myOpportunities"></div>
      </div>

      <!-- APPLICATIONS TAB -->
      <div id="applicationsTab" class="tab-content">
        <h2>Applications</h2>
        <div id="applicationsList"></div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="../public/firebase.js"></script>
  <script src="../roles_js/provider_view.js"></script>

  <!-- SAQA NQF Level Dropdown -->
  <script>
    async function loadNQFLevels() {
      const select = document.getElementById('nqf_level');
      try {
        const res = await fetch('/api/qualifications/nqf-levels');
        const levels = await res.json();

        select.innerHTML = '<option value="">Select NQF Level</option>';
        levels.forEach(level => {
          const opt = document.createElement('option');
          opt.value = level;
          opt.textContent = `NQF Level ${level}`;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error('Failed to load NQF levels:', err);
        select.innerHTML = '<option value="">Could not load NQF levels</option>';
      }
    }

    // Load NQF levels when page loads
    loadNQFLevels();
  </script>
</body>

</html>
