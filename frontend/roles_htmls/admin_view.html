<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - SkillBridge</title>
  <link rel="stylesheet" href="../roles_css/admin_view.css" />
  <link rel="stylesheet" href="../roles_css/common.css" />
</head>

<body style="display: none;">
  <div class="layout">
    <nav class="sidebar">
      <h2>SkillBridge</h2>
      <hr />
      <ul class="nav-links">
        <li><a href="#" onclick="showTab('opportunities')">Opportunities</a></li>
        <li><a href="#" onclick="showTab('users')">Users</a></li>
        <li><a href="/login">Logout</a></li>
      </ul>
    </nav>

    <main class="container">
      <header class="header">
        <h1>🛡️ Admin Dashboard</h1>
        <p>Welcome, Admin! Manage opportunities and users below.</p>
      </header>

      <div class="stats" id="stats">
        <div class="stat-card">
          <h3 id="totalOpportunities">0</h3>
          <p>Total Opportunities</p>
        </div>
        <div class="stat-card">
          <h3 id="pendingOpportunities">0</h3>
          <p>Pending Approval</p>
        </div>
        <div class="stat-card">
          <h3 id="totalApplicants">0</h3>
          <p>Total Applicants</p>
        </div>
        <div class="stat-card">
          <h3 id="totalProviders">0</h3>
          <p>Total Providers</p>
        </div>
      </div>

      <div id="opportunitiesTab" class="tab-content active">
        <div class="section">
          <h2>Pending Opportunities</h2>
          <div id="pendingTable"></div>
        </div>
        <div class="section">
          <h2>All Opportunities</h2>
          <div id="allTable"></div>
        </div>
      </div>

      <div id="usersTab" class="tab-content">
        <div class="section">
          <h2>Applicants</h2>
          <div id="applicantsTable"></div>
        </div>
        <div class="section">
          <h2>Providers</h2>
          <div id="providersTable"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="../public/firebase.js"></script>
  <script src="../roles_js/admin_view.js"></script>
<body style="display: none;">

</html>
