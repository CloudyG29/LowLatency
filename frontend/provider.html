<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provider Dashboard - SkillBridge</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    color: white;
    padding: 30px 20px;
}

.container { max-width: 900px; margin: 0 auto; }

.header {
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.header h1 {
    font-size: 2rem;
    background: linear-gradient(90deg, #38ef7d, #11998e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.tab {
    padding: 10px 25px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    cursor: pointer;
    color: #a0aec0;
}

.tab.active {
    background: linear-gradient(90deg, #38ef7d, #11998e);
    color: white;
    border-color: transparent;
}

.tab-content { display: none; }
.tab-content.active { display: block; }

h2 {
    font-size: 1rem;
    color: #68d391;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

/* CARD STYLE MATCHED */
.card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    padding: 25px;
    border-radius: 16px;
}

/* OPPORTUNITY CARDS */
.opportunity-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 15px;
}

.opportunity-card h3 {
    color: #38ef7d;
    margin-bottom: 10px;
}

.opportunity-card p {
    color: #a0aec0;
    font-size: 0.9rem;
    margin: 5px 0;
}

.status-badge {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: bold;
}

.status-pending { background: rgba(246,201,14,0.15); color: #f6c90e; }
.status-approved { background: rgba(104,211,145,0.15); color: #68d391; }

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: white;
}

.post-btn {
    background: linear-gradient(90deg, #38ef7d, #11998e);
    border: none;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
}

.delete-btn {
    margin-top: 10px;
    background: rgba(255,255,255,0.05);
    color: #fc8181;
    border: 1px solid rgba(252,129,129,0.3);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
}

.btn-hire { background: #38ef7d; border: none; padding: 5px 10px; margin-right:5px; }
.btn-reject { background: #f5576c; border: none; padding: 5px 10px; }

.back-link {
    display: inline-block;
    margin-top: 30px;
    color: #63b3ed;
    text-decoration: none;
}

</style>
</head>

<body>

<div class="container">
    <div class="header">
        <h1>🏢 Provider Dashboard</h1>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="showTab('post')">Post</button>
        <button class="tab" onclick="showTab('manage')">My Opportunities</button>
        <button class="tab" onclick="showTab('applications')">Applications</button>
    </div>

    <!-- POST -->
    <div id="postTab" class="tab-content active">
        <div class="card">
            <input id="title" placeholder="Title">
            <input id="company" placeholder="Company">
            <input id="location" placeholder="Location">
            <input id="duration" placeholder="Duration">
            <input id="stipend" placeholder="Stipend">
            <textarea id="description" placeholder="Description"></textarea>
            <button class="post-btn" onclick="postOpportunity()">Post</button>
            <p id="msg"></p>
        </div>
    </div>

    <!-- MANAGE -->
    <div id="manageTab" class="tab-content">
        <h2>My Opportunities</h2>
        <div id="myOpportunities"></div>
    </div>

    <!-- APPLICATIONS -->
    <div id="applicationsTab" class="tab-content">
        <h2>Applications</h2>
        <div id="applicationsList"></div>
    </div>

    <a href="/login.html" class="back-link">← Logout</a>
</div>

<script>

// STORAGE
let myOpportunities = JSON.parse(localStorage.getItem('providerOpportunities') || '[]');

function saveOpportunities() {
    localStorage.setItem('providerOpportunities', JSON.stringify(myOpportunities));
}

// POST
function postOpportunity() {
    const opp = {
        title: title.value,
        company: company.value,
        location: location.value,
        duration: duration.value,
        stipend: stipend.value,
        description: description.value,
        status: 'pending'
    };

    if (!opp.title || !opp.company) {
        msg.innerText = "⚠️ Fill title + company";
        msg.style.color = "#fc8181";
        return;
    }

    myOpportunities.push(opp);
    saveOpportunities();

    msg.innerText = "✅ Posted! Waiting for admin.";
    msg.style.color = "#68d391";

    document.querySelectorAll('input, textarea').forEach(el => el.value = '');
    displayOpportunities();
}

// DISPLAY OPPORTUNITIES
function displayOpportunities() {
    const container = document.getElementById('myOpportunities');
    myOpportunities = JSON.parse(localStorage.getItem('providerOpportunities') || '[]');

    if (myOpportunities.length === 0) {
        container.innerHTML = '<p style="color:#718096;">No opportunities yet.</p>';
        return;
    }

    container.innerHTML = '';

    myOpportunities.forEach((opp, i) => {
        const div = document.createElement('div');
        div.className = 'opportunity-card';

        div.innerHTML = `
            <h3>${opp.title}</h3>
            <p>${opp.company} · ${opp.location}</p>
            <span class="status-badge status-${opp.status}">${opp.status}</span><br>
            <button class="delete-btn" onclick="deleteOpp(${i})">Delete</button>
        `;

        container.appendChild(div);
    });
}

// DELETE
function deleteOpp(i) {
    myOpportunities.splice(i, 1);
    saveOpportunities();
    displayOpportunities();
}

// APPLICATIONS
function getApplications() {
    return JSON.parse(localStorage.getItem('applications') || '[]');
}

function saveApplications(apps) {
    localStorage.setItem('applications', JSON.stringify(apps));
}

function displayApplications() {
    const container = document.getElementById('applicationsList');
    const apps = getApplications();

    if (apps.length === 0) {
        container.innerHTML = '<p style="color:#718096;">No applications yet.</p>';
        return;
    }

    container.innerHTML = '';

    apps.forEach((app, i) => {
        const div = document.createElement('div');
        div.className = 'opportunity-card';

        div.innerHTML = `
            <p><strong>${app.applicantName}</strong> applied for ${app.title}</p>
            <span class="status-badge status-${app.status.toLowerCase()}">${app.status}</span><br><br>
            ${app.status === 'Pending' ? `
                <button class="btn-hire" onclick="hire(${i})">Hire</button>
                <button class="btn-reject" onclick="reject(${i})">Reject</button>
            ` : ''}
        `;

        container.appendChild(div);
    });
}

// ACTIONS
function hire(i) {
    let apps = getApplications();
    apps[i].status = "Hired";
    saveApplications(apps);
    displayApplications();
}

function reject(i) {
    let apps = getApplications();
    apps[i].status = "Rejected";
    saveApplications(apps);
    displayApplications();
}

// TABS
function showTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

    if (tab === 'post') {
        document.querySelector('.tab:nth-child(1)').classList.add('active');
        postTab.classList.add('active');
    }

    if (tab === 'manage') {
        document.querySelector('.tab:nth-child(2)').classList.add('active');
        manageTab.classList.add('active');
        displayOpportunities();
    }

    if (tab === 'applications') {
        document.querySelector('.tab:nth-child(3)').classList.add('active');
        applicationsTab.classList.add('active');
        displayApplications();
    }
}

// INIT
displayOpportunities();

</script>

</body>
</html>
