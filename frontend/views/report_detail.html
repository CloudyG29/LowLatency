<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Detail - SkillBridge Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ── Navbar ── */
    .navbar {
      background: #1e293b;
      padding: 16px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 1px;
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .back-btn {
      background: #334155;
      color: #94a3b8;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: none;
      transition: background 0.2s;
    }
    .back-btn:hover { background: #475569; color: #e2e8f0; }

    /* ── Layout ── */
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 24px 80px;
    }

    /* ── Loading ── */
    .state-box {
      text-align: center;
      padding: 80px 20px;
      color: #64748b;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Page Header ── */
    .page-header {
      margin-bottom: 32px;
    }
    .breadcrumb {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 12px;
    }
    .breadcrumb a {
      color: #38bdf8;
      text-decoration: none;
    }
    .breadcrumb a:hover { text-decoration: underline; }
    .report-title-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .report-title-row h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #f1f5f9;
    }
    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .badge-reason  { background: #7c2d12; color: #fca5a5; }
    .badge-pending   { background: #78350f22; color: #f59e0b; border: 1px solid #f59e0b; }
    .badge-resolved  { background: #06402622; color: #10b981; border: 1px solid #10b981; }
    .badge-dismissed { background: #31274822; color: #a78bfa; border: 1px solid #a78bfa; }

    /* ── Cards ── */
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px 32px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #38bdf8;
      font-weight: 700;
      margin-bottom: 20px;
    }

    /* ── Info Grid ── */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .info-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px 16px;
    }
    .info-item .lbl {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #64748b;
      margin-bottom: 6px;
    }
    .info-item .val {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e2e8f0;
      word-break: break-word;
    }

    /* ── Details Box ── */
    .details-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 20px;
      color: #94a3b8;
      line-height: 1.8;
      font-size: 0.95rem;
    }

    /* ── Listing Preview ── */
    .listing-preview {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    /* ── Timeline ── */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .timeline-item {
      display: flex;
      gap: 16px;
      padding-bottom: 20px;
      position: relative;
    }
    .timeline-item:not(:last-child)::before {
      content: '';
      position: absolute;
      left: 15px;
      top: 32px;
      bottom: 0;
      width: 2px;
      background: #334155;
    }
    .timeline-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
      z-index: 1;
    }
    .timeline-dot.red    { background: #7f1d1d; }
    .timeline-dot.blue   { background: #1e3a5f; }
    .timeline-dot.green  { background: #064e3b; }
    .timeline-dot.purple { background: #3b0764; }
    .timeline-content { padding-top: 4px; }
    .timeline-content .tl-title {
      font-weight: 600;
      color: #e2e8f0;
      font-size: 0.9rem;
      margin-bottom: 2px;
    }
    .timeline-content .tl-sub {
      font-size: 0.8rem;
      color: #64748b;
    }

    /* ── Action Section ── */
    .action-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px 32px;
      margin-bottom: 20px;
    }
    .action-card .card-title { margin-bottom: 8px; }
    .action-card p {
      color: #64748b;
      font-size: 0.88rem;
      margin-bottom: 20px;
    }
    .action-buttons {
      display: flex;
      gap: 14px;
    }
    .btn-delete-listing {
      flex: 2;
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 16px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-delete-listing:hover { background: #b91c1c; }
    .btn-delete-listing:active { transform: scale(0.98); }
    .btn-dismiss {
      flex: 1;
      background: transparent;
      border: 1px solid #10b981;
      color: #10b981;
      padding: 16px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-dismiss:hover { background: rgba(16,185,129,0.1); }

    /* ── Resolved Banner ── */
    .resolved-banner {
      background: #064e3b22;
      border: 1px solid #10b981;
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #10b981;
      font-weight: 600;
    }
    .dismissed-banner {
      background: #3b076422;
      border: 1px solid #a78bfa;
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #a78bfa;
      font-weight: 600;
    }
    .banner-icon { font-size: 1.5rem; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: transform 0.3s ease;
      z-index: 9999;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .toast.show  { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: #10b981; color: #10b981; }
    .toast.error   { border-color: #f87171; color: #f87171; }

    @media (max-width: 640px) {
      .navbar { padding: 14px 20px; }
      .container { padding: 0 16px 60px; }
      .card { padding: 20px; }
      .info-grid { grid-template-columns: 1fr 1fr; }
      .listing-preview { grid-template-columns: 1fr; }
      .action-buttons { flex-direction: column; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">SkillBridge</div>
    <div class="nav-right">
      <a href="/admin" class="back-btn">← Back to Dashboard</a>
      <a href="/login" class="back-btn">Logout</a>
    </div>
  </nav>

  <div class="container">
    <div id="content">
      <div class="state-box">
        <div class="spinner"></div>
        <p>Loading report...</p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="/public/firebase.js"></script>
  <script>
    const reportId = window.location.pathname.split('/').pop();
    let reportData = null;

    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast ${type} show`;
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    async function getAuthHeaders() {
      return new Promise((resolve, reject) => {
        firebase.auth().onAuthStateChanged(async (user) => {
          if (!user) { window.location.href = '/login'; return; }
          const token = await user.getIdToken();
          resolve({
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json'
          });
        });
      });
    }

    async function loadReport() {
      try {
        const headers  = await getAuthHeaders();
        const response = await fetch(`/api/reports/${reportId}`, { headers });
        reportData     = await response.json();

        if (!response.ok) throw new Error(reportData.error || 'Failed to load report');

        renderReport();
      } catch (err) {
        document.getElementById('content').innerHTML = `
          <div class="state-box">
            <p style="color:#f87171">⚠ ${err.message}</p>
          </div>`;
      }
    }

    function renderReport() {
      const r           = reportData;
      const listing     = r.listing;
      const statusClass = `badge-${r.status}`;
      const listingName = listing?.listname || 'Listing Deleted';
      const providerName = listing?.provider?.provider_name || '—';

      document.getElementById('content').innerHTML = `

        <!-- Page Header -->
        <div class="page-header">
          <div class="breadcrumb">
            <a href="/admin">Admin Dashboard</a> › <a href="/admin" onclick="history.back();return false;">Reports</a> › Report #${r.report_id}
          </div>
          <div class="report-title-row">
            <h1>Report #${r.report_id}</h1>
            <span class="badge badge-reason">${r.reason}</span>
            <span class="badge ${statusClass}">${r.status}</span>
          </div>
        </div>

        <!-- Report Info -->
        <div class="card">
          <div class="card-title">Report Information</div>
          <div class="info-grid">
            <div class="info-item">
              <div class="lbl">Reported By</div>
              <div class="val">${r.reported_by}</div>
            </div>
            <div class="info-item">
              <div class="lbl">Date Submitted</div>
              <div class="val">${new Date(r.created_at).toDateString()}</div>
            </div>
            <div class="info-item">
              <div class="lbl">Reason</div>
              <div class="val">${r.reason}</div>
            </div>
          </div>

          <div style="margin-top:16px;">
            <div class="card-title" style="margin-bottom:12px;">Details Provided</div>
            <div class="details-box">${r.details || 'No additional details provided.'}</div>
          </div>
        </div>

        <!-- Listing Info -->
        <div class="card">
          <div class="card-title">Reported Listing</div>
          ${listing ? `
            <div class="listing-preview">
              <div class="info-item">
                <div class="lbl">Listing Title</div>
                <div class="val">${listing.listname}</div>
              </div>
              <div class="info-item">
                <div class="lbl">Provider</div>
                <div class="val">${providerName}</div>
              </div>
              <div class="info-item">
                <div class="lbl">Type</div>
                <div class="val">${listing.list_type || '—'}</div>
              </div>
              <div class="info-item">
                <div class="lbl">Location</div>
                <div class="val">${listing.location || '—'}</div>
              </div>
              <div class="info-item">
                <div class="lbl">Stipend</div>
                <div class="val">${listing.stipend ? 'R' + Number(listing.stipend).toLocaleString() : '—'}</div>
              </div>
              <div class="info-item">
                <div class="lbl">NQF Level</div>
                <div class="val">${listing.nqf_level ? 'NQF ' + listing.nqf_level : '—'}</div>
              </div>
            </div>
            <div style="margin-top:14px;">
              <div class="info-item">
                <div class="lbl">Description</div>
                <div class="val" style="font-weight:400;color:#94a3b8;line-height:1.7;">${listing.description || 'No description.'}</div>
              </div>
            </div>
          ` : `
            <div style="background:#0f172a;border:1px solid #334155;border-radius:10px;padding:20px;color:#64748b;text-align:center;">
              This listing has been deleted.
            </div>
          `}
        </div>

        <!-- Timeline -->
        <div class="card">
          <div class="card-title">Activity Timeline</div>
          <div class="timeline">
            <div class="timeline-item">
              <div class="timeline-dot red">🚩</div>
              <div class="timeline-content">
                <div class="tl-title">Report Submitted</div>
                <div class="tl-sub">${r.reported_by} · ${new Date(r.created_at).toDateString()}</div>
              </div>
            </div>
            <div class="timeline-item">
              <div class="timeline-dot blue">👁</div>
              <div class="timeline-content">
                <div class="tl-title">Under Admin Review</div>
                <div class="tl-sub">Awaiting action from admin</div>
              </div>
            </div>
            ${r.status !== 'pending' ? `
              <div class="timeline-item">
                <div class="timeline-dot ${r.status === 'resolved' ? 'green' : 'purple'}">
                  ${r.status === 'resolved' ? '🗑' : '✓'}
                </div>
                <div class="timeline-content">
                  <div class="tl-title">${r.status === 'resolved' ? 'Listing Deleted' : 'Report Dismissed'}</div>
                  <div class="tl-sub">Action taken by admin · Recorded for analytics</div>
                </div>
              </div>
            ` : ''}
          </div>
        </div>

        <!-- Action Section -->
        ${r.status === 'pending' ? `
          <div class="action-card">
            <div class="card-title">Take Action</div>
            
            <div class="action-buttons">
              <button class="btn-delete-listing" onclick="deleteListing()">
                🗑 Delete Listing
                <span style="font-weight:400;font-size:0.8rem;opacity:0.8;">— removes it from applicant site</span>
              </button>
              <button class="btn-dismiss" onclick="dismissReport()">
                ✓ Dismiss Report
              </button>
            </div>
          </div>
        ` : r.status === 'resolved' ? `
          <div class="resolved-banner">
            <span class="banner-icon">✅</span>
            <div>
              <div>Listing has been deleted</div>
              <div style="font-weight:400;font-size:0.85rem;opacity:0.8;margin-top:2px;">This report is resolved and recorded for analytics.</div>
            </div>
          </div>
        ` : `
          <div class="dismissed-banner">
            <span class="banner-icon">📋</span>
            <div>
              <div>Report was dismissed</div>
              <div style="font-weight:400;font-size:0.85rem;opacity:0.8;margin-top:2px;">The listing remains live. This report is recorded for analytics.</div>
            </div>
          </div>
        `}
      `;
    }

    async function deleteListing() {
      const listing = reportData?.listing;
      if (!listing) {
        showToast('Listing already deleted.', 'error');
        return;
      }
      if (!confirm(`Delete "${listing.listname}"? This cannot be undone.`)) return;

      try {
        const headers = await getAuthHeaders();
        const res = await fetch(`/api/listings/${listing.listings_id}`, {
  method: 'DELETE',
  headers,
  body: JSON.stringify({ report_id: reportData.report_id })
});
        if (!res.ok) throw new Error('Delete failed');
        showToast('Listing deleted successfully.', 'success');
        setTimeout(() => window.location.href = '/admin', 1500);
      } catch (err) {
        showToast('Failed to delete listing.', 'error');
      }
    }

    async function dismissReport() {
      try {
        const headers = await getAuthHeaders();
        const res = await fetch(`/api/reports/${reportId}/status`, {
          method: 'PATCH', headers,
          body: JSON.stringify({ status: 'dismissed' })
        });
        if (!res.ok) throw new Error('Dismiss failed');
        showToast('Report dismissed and recorded.', 'success');
        setTimeout(() => window.location.href = '/admin', 1500);
      } catch (err) {
        showToast('Failed to dismiss report.', 'error');
      }
    }

    loadReport();
  </script>
</body>
</html>
