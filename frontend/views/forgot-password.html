<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SkillBridge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d1117, #111827, #0f2040);
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            width: 380px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        h2 {
            margin-bottom: 10px;
            font-size: 1.8rem;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #a0aec0;
            font-size: 0.9rem;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
            text-align: left;
        }

        input::placeholder { color: #718096; }
        input:focus { border-color: #0072ff; }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s ease;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            color: white;
        }

        button:hover { opacity: 0.85; }

        .success {
            color: #68d391;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
        }

        .error {
            color: #fc8181;
            margin-top: 10px;
            font-size: 0.9rem;
            display: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #63b3ed;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔑</div>
        <h2>Forgot Password?</h2>
        <p>Enter your email address and we'll send you a link to reset your password.</p>

        <input type="email" id="email" placeholder="Enter your email" required autocomplete="off">
        <button id="resetBtn">Send Reset Link</button>

        <div id="successMsg" class="success">
            ✅ Password reset email sent! Check your inbox.
        </div>
        <div id="errorMsg" class="error"></div>

        <a href="/login" class="back-link">← Back to Login</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDgirf1peij-kkhv9ir_5ea-L245W921w8",
            authDomain: "skillbridge-5dcec.firebaseapp.com",
            projectId: "skillbridge-5dcec",
            storageBucket: "skillbridge-5dcec.firebasestorage.app",
            messagingSenderId: "188202128236",
            appId: "1:188202128236:web:aee457ff824cba8c965949",
            measurementId: "G-NBYFQX660Y"
        };
        firebase.initializeApp(firebaseConfig);

        document.getElementById('resetBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const successMsg = document.getElementById('successMsg');
            const errorMsg = document.getElementById('errorMsg');

            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';

            if (!email) {
                errorMsg.innerText = '⚠️ Please enter your email address.';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                await firebase.auth().sendPasswordResetEmail(email);
                successMsg.style.display = 'block';
                document.getElementById('email').value = '';
            } catch (error) {
                errorMsg.innerText = '❌ ' + error.message;
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
