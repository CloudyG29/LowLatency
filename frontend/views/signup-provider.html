<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Signup - SkillBridge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
            background: linear-gradient(90deg, #38ef7d, #11998e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        input::placeholder { color: #718096; }
        input:focus { border-color: #38ef7d; }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button:hover { opacity: 0.85; }

        .signup-btn {
            background: linear-gradient(90deg, #38ef7d, #11998e);
            color: white;
        }

        .google-btn {
            background: linear-gradient(90deg, #f093fb, #f5576c);
            color: white;
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            color: #718096;
            position: relative;
        }

        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        .divider span {
            background: transparent;
            padding: 0 10px;
            position: relative;
        }

        .error {
            color: #fc8181;
            margin-top: 10px;
            text-align: center;
            font-size: 0.9rem;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #63b3ed;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover { text-decoration: underline; }

        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #a0aec0;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }

        .login-link a { color: #63b3ed; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }

        /* From Uiverse.io by PriyanshuGupta28 */ 
.spinner {
    position: relative;
    width: 20px;
    height: 20px;
  }
  
  .spinner div {
    position: absolute;
    width: 50%;
    height: 150%;
    background: #000000;
    transform: rotate(calc(var(--rotation) * 1deg)) translate(0, calc(var(--translation) * 1%));
    animation: spinner-fzua35 1s calc(var(--delay) * 1s) infinite ease;
  }
  
  .spinner div:nth-child(1) {
    --delay: 0.1;
    --rotation: 36;
    --translation: 150;
  }
  
  .spinner div:nth-child(2) {
    --delay: 0.2;
    --rotation: 72;
    --translation: 150;
  }
  
  .spinner div:nth-child(3) {
    --delay: 0.3;
    --rotation: 108;
    --translation: 150;
  }
  
  .spinner div:nth-child(4) {
    --delay: 0.4;
    --rotation: 144;
    --translation: 150;
  }
  
  .spinner div:nth-child(5) {
    --delay: 0.5;
    --rotation: 180;
    --translation: 150;
  }
  
  .spinner div:nth-child(6) {
    --delay: 0.6;
    --rotation: 216;
    --translation: 150;
  }
  
  .spinner div:nth-child(7) {
    --delay: 0.7;
    --rotation: 252;
    --translation: 150;
  }
  
  .spinner div:nth-child(8) {
    --delay: 0.8;
    --rotation: 288;
    --translation: 150;
  }
  
  .spinner div:nth-child(9) {
    --delay: 0.9;
    --rotation: 324;
    --translation: 150;
  }
  
  .spinner div:nth-child(10) {
    --delay: 1;
    --rotation: 360;
    --translation: 150;
  }
  
  @keyframes spinner-fzua35 {
    0%, 10%, 20%, 30%, 50%, 60%, 70%, 80%, 90%, 100% {
      transform: rotate(calc(var(--rotation) * 1deg)) translate(0, calc(var(--translation) * 1%));
    }
  
    50% {
      transform: rotate(calc(var(--rotation) * 1deg)) translate(0, calc(var(--translation) * 1.5%));
    }
  }

  .loader-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(15, 52, 96, 0.7); /* matches your theme */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    opacity: 1;
    transition: opacity 0.3s ease;
}

/* Hide by default */
.loader-overlay.hidden {
    opacity: 0;
    pointer-events: none;
}
    </style>
</head>
<body>

    <!-- From Uiverse.io by PriyanshuGupta28 -->
  <div id="loader" class="loader-overlay hidden">
    <div class="spinner">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>
    <div class="container">
        <h2>🏢 Provider Signup</h2>

        <button class="google-btn" id="googleSignup">Sign up with Google</button>

        <div class="divider"><span>or</span></div>

        <form id="signupForm" autocomplete="off">
            <input type="text" id="companyName" placeholder="Company Name" required autocomplete="off">
            <input type="email" id="email" placeholder="Company Email" required autocomplete="off">
            <input type="password" id="password" placeholder="Password" required autocomplete="new-password">
            <button type="submit" class="signup-btn">Sign Up</button>
        </form>

        <div id="errorMsg" class="error"></div>
        <a href="/" class="back-link">← Back to Home</a>
        <div class="login-link">Already have an account? <a href="/login">Login here</a></div>
    </div>


<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script src="../public/firebase.js"></script> 

<script>
    const errorDiv = document.getElementById('errorMsg');

    // 1. Google Signup Click
    document.getElementById('googleSignup').addEventListener('click', async () => {
        errorDiv.innerText = '';
        try {
            showLoader();
            await signUpWithGoogle('Provider');
            hideLoader();
        } catch (error) {
            hideLoader();
            errorDiv.innerText = 'Google signup failed: ' + error.message;
        }

    });

    // 2. Email Form Submit
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        errorDiv.innerText = '';
        const companyName = document.getElementById('companyName').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            showLoader();
            await signUpWithEmail(email, password, companyName, '', 'Provider');
            hideLoader();
            alert('Provider account created successfully. Please log in to continue.');
            window.location.href = '/login';
        } catch (error) {
            hideLoader();
            errorDiv.innerText = error.message;
        }
    });

    function showLoader() {
  document.getElementById('loader').classList.remove('hidden');
}

function hideLoader() {
  document.getElementById('loader').classList.add('hidden');
}
</script>
</body>
</html>
