<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provider Applications</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7fb;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #333;
    }

    #applications-container {
      display: grid;
      gap: 16px;
      margin-top: 20px;
    }

    .application-card {
      background: white;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .application-card h3 {
      margin-top: 0;
    }

    .status {
      font-weight: bold;
      margin-top: 10px;
    }

    .error {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Applications</h1>
  <p id="message">Loading applications...</p>
  <div id="applications-container"></div>

  <script>
    const firebaseUid = localStorage.getItem("uid");
    const message = document.getElementById("message");
    const container = document.getElementById("applications-container");

    if (!firebaseUid) {
      message.textContent = "No logged-in provider found.";
    } else {
      fetch(`/applications/provider/${firebaseUid}`)
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            message.textContent = data.error;
            message.classList.add("error");
            return;
          }

          if (!data.length) {
            message.textContent = "No applications found.";
            return;
          }

          message.textContent = "";
          data.forEach(application => {
            const card = document.createElement("div");
            card.className = "application-card";

            card.innerHTML = `
              <h3>${application.user.name} ${application.user.surname}</h3>
              <p><strong>Listing:</strong> ${application.listing.listname}</p>
              <p><strong>Email:</strong> ${application.user.email}</p>
              <p><strong>CV:</strong> ${application.user.cv ? application.user.cv : "No CV uploaded"}</p>
              <p class="status"><strong>Status:</strong> ${application.status}</p>
            `;

            container.appendChild(card);
          });
        })
        .catch(error => {
          console.error("Error loading applications:", error);
          message.textContent = "Failed to load applications.";
          message.classList.add("error");
        });
    }
  </script>
</body>
</html>
